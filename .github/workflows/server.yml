name: server

on:
  workflow_dispatch:
  pull_request:
    paths: ["server/**", "cli/src/**", ".github/workflows/server.yml"]
  push:
    branches: [main]
    paths: ["server/**", "cli/src/**", ".github/workflows/server.yml"]

permissions: {}

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipod
          POSTGRES_PASSWORD: pipod
          POSTGRES_DB: pipod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipod -d pipod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://pipod:pipod@localhost:5432/pipod
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply migrations
        run: npm run migrate

      - name: Core drift, pi pin, typecheck
        run: npm run check

      - name: Build
        run: npm run build
