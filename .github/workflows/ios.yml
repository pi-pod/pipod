name: ios

# Compile the app on a simulator using local ad-hoc signing. No certificate,
# provisioning profile, or repository secrets are needed; signing preserves
# simulator Keychain access, unlike CODE_SIGNING_ALLOWED=NO.

on:
  workflow_dispatch:
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          # shellcheck disable=SC2012
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project PiPod.xcodeproj -scheme PiPod -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            build | tail -100
