name: repo

# The CLI and the server must bundle the same exact pi; pods run what the server bundles.
on:
  workflow_dispatch:
  pull_request:
    paths: ["cli/package*.json", "server/package*.json", "server/image/**", "scripts/pi-pins.mjs", ".github/workflows/repo.yml"]
  push:
    branches: [main]
    paths: ["cli/package*.json", "server/package*.json", "server/image/**", "scripts/pi-pins.mjs", ".github/workflows/repo.yml"]

permissions: {}

jobs:
  pi-pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - name: CLI and server pin the same pi
        run: node scripts/pi-pins.mjs check
