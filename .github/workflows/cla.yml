name: cla

# Every commit author on a pull request signs CLA.md once, by commenting the signing sentence.
# Signatures are appended to signatures.json on the cla-signatures branch, recording the
# CLA.md blob each person signed. Bots and people with write access are exempt.
#
# pull_request_target hands fork pull requests a write token, so this workflow must never
# check out or run pull request code. It reads the pull request only through the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write       # append to signatures.json on the cla-signatures branch
      pull-requests: write  # the instructions comment
      statuses: write       # the `cla` commit status
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const PHRASE = "I have read the CLA Document and I hereby sign the CLA";
            const BRANCH = "cla-signatures";
            const FILE = "signatures.json";
            const MARKER = "<!-- cla -->";
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const number = context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const docUrl = `https://github.com/${owner}/${repo}/blob/${defaultBranch}/CLA.md`;

            async function loadSignatures() {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH });
              return { sha: data.sha, list: JSON.parse(Buffer.from(data.content, "base64").toString("utf8")) };
            }

            async function hasWriteAccess(username) {
              try {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username });
                return data.permission === "admin" || data.permission === "write";
              } catch {
                return false;
              }
            }

            // A comment consisting of the signing sentence signs for its author.
            const normalize = (text) => text.trim().replace(/\s+/g, " ").replace(/\.$/, "").toLowerCase();
            const comment = context.payload.comment;
            if (comment && normalize(comment.body) === normalize(PHRASE)) {
              const { data: doc } = await github.rest.repos.getContent({ owner, repo, path: "CLA.md", ref: defaultBranch });
              for (let attempt = 1; ; attempt++) {
                const { sha, list } = await loadSignatures();
                if (list.some((s) => s.id === comment.user.id)) break;
                list.push({
                  login: comment.user.login,
                  id: comment.user.id,
                  signedAt: comment.created_at,
                  claBlob: doc.sha,
                  pullRequest: number,
                  comment: comment.html_url,
                });
                try {
                  await github.rest.repos.createOrUpdateFileContents({
                    owner, repo, branch: BRANCH, path: FILE, sha,
                    message: `CLA signed by @${comment.user.login}`,
                    content: Buffer.from(JSON.stringify(list, null, 2) + "\n").toString("base64"),
                  });
                  break;
                } catch (error) {
                  // 409: another signature landed first; reload and append again.
                  if (error.status !== 409 || attempt === 3) throw error;
                }
              }
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 });
            const authors = new Map();
            const unlinked = new Set();
            for (const c of commits) {
              if (!c.author) unlinked.add(c.commit.author.name);
              else if (c.author.type !== "Bot") authors.set(c.author.id, c.author.login);
            }
            const signed = new Set((await loadSignatures()).list.map((s) => s.id));
            const missing = [];
            for (const [id, login] of authors) {
              if (!signed.has(id) && !(await hasWriteAccess(login))) missing.push(login);
            }
            const ok = missing.length === 0 && unlinked.size === 0;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: "cla", target_url: docUrl,
              state: ok ? "success" : "failure",
              description: ok ? "Contributor License Agreement signed" : "Contributor License Agreement signature needed",
            });

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
            const existing = comments.find((c) => c.user.type === "Bot" && c.body.startsWith(MARKER));
            let body;
            if (ok) {
              if (!existing) return;
              body = `${MARKER}\nEvery commit author has signed the [Contributor License Agreement](${docUrl}). Thank you.`;
            } else {
              const lines = [
                MARKER,
                `Thank you for the contribution. Before it can be merged, every commit author needs to sign the [Contributor License Agreement](${docUrl}) once, by commenting on this pull request:`,
                "",
                `> ${PHRASE}`,
                "",
              ];
              if (missing.length) lines.push(`Not signed yet: ${missing.map((l) => `@${l}`).join(", ")}`);
              if (unlinked.size) lines.push(`Commits by ${[...unlinked].join(", ")} are not linked to a GitHub account. Add the commit email to your account, or amend the commits, then push again.`);
              body = lines.join("\n");
            }
            if (existing) {
              if (existing.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
