org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# The project applies the Kotlin Android plugin explicitly rather than relying on
# AGP 9's built-in Kotlin support, and uses the AGP 8-style DSL.
android.newDsl=false
android.builtInKotlin=false

kotlin.code.style=official
android.suppressUnsupportedCompileSdk=37
